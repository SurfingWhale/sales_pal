# firestore.rules goes live by itself: every change is tested against the
# emulator (tests/firestore.rules.test.mjs, every role), and on main it is
# deployed to the sales-pal project — the same way Vercel ships the app.
#
# Deploying needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key
# of a service account with only "Firebase Rules Admin" and "Service Usage
# Consumer". Without it the deploy step is skipped, never failed.
name: firestore-rules

on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, tests/firestore.rules.test.mjs, .github/workflows/firestore-rules.yml]
  pull_request:
    paths: [firestore.rules, firebase.json, tests/firestore.rules.test.mjs, .github/workflows/firestore-rules.yml]
  workflow_dispatch:

# One deploy at a time, and never cancelled halfway.
concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm i --no-save @firebase/rules-unit-testing@3   # v3 pairs with firebase 10
      - run: npm install -g firebase-tools@14
      - name: Test the rules, every role
        run: firebase emulators:exec --only firestore --project demo-salespal "node tests/firestore.rules.test.mjs"

      - name: Deploy to sales-pal
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set: rules tested, not deployed."
            exit 0
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" firebase deploy --only firestore:rules --project sales-pal --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
          echo "Rules deployed to sales-pal at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
